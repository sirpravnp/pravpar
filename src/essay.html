<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta property="og:title" content="{{title}}"><meta property="og:description" content="{{summary}}"><meta property="og:type" content="article"><meta property="og:image" content="https://pravpar.com/assets/icon-512.png"><meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&display=swap">

<body><main>
<header><a class="name" href="../">Praveen Parthasarathy</a><input id="theme" type="checkbox" aria-label="Toggle light/dark theme"></header>
<article><h1>{{title}}</h1><div class="meta">{{date}} · {{minutes}} min read</div>

</article>
</main><script src="../theme.js"></script></body></html>
